services:
  selenium-hub:
    image: selenium/hub:4.51.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  chrome:
    image: selenium/node-chrome:4.51.0
    shm_size: 2gb
    depends_on: [ selenium-hub ]
    environment: &node-env
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: 4442
      SE_EVENT_BUS_SUBSCRIBE_PORT: 4443
      SE_NODE_MAX_SESSIONS: 2
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    ports:
      - "7900:7900"

  firefox:
    image: selenium/node-firefox:4.51.0
    shm_size: 2gb
    depends_on: [ selenium-hub ]
    environment: *node-env
    ports:
      - "7901:7900"

  edge:
    image: selenium/node-edge:4.51.0
    shm_size: 2gb
    depends_on: [ selenium-hub ]
    environment: *node-env
    ports:
      - "7902:7900"