name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      group:
        description: Test group to run
        type: choice
        options: [smoke, regression]
        default: smoke

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROUP: ${{ github.event_name == 'push' && 'regression' || inputs.group || 'smoke' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Start Selenium Grid
        run: docker compose up -d selenium-hub chrome

      - name: Run ${{ env.GROUP }} tests
        run: >
          mvn -B test
          -DexecutionType=remote
          -DbrowserType=chrome
          -Dgroups=${{ env.GROUP }}
          -DopenReportAfterExecution=false

      - name: Upload report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-output-${{ env.GROUP }}
          path: |
            test-output/reports/
            test-output/screenshots/
            test-output/logs/
          retention-days: 14

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
