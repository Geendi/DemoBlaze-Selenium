# BrowserType > chrome - edge - firefox
browserType=chrome
# executionType  > local - localHeadless - remote (remote runs browserType in the Selenium Grid at remoteUrl)
executionType=local
# Selenium Grid address, used only when executionType=remote
remoteUrl=http://localhost:4444
# Max seconds to wait for the Grid /status to report ready before the first remote test
gridReadySeconds=30
# Max seconds WaitBot waits for an element or page change
fluentWaitSeconds=10
# Allure commandline version (Allure 2.x from Maven Central)
allureVersion=2.46.1
# Open the single-file Allure report after a local run
openReportAfterExecution=true
