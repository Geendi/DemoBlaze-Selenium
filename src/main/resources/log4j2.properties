# Log files location
property.basePath=test-output/logs
# Define the file appender (one file per run, overwritten each run)
appender.file.type=File
appender.file.name=fileAppender
appender.file.fileName=${basePath}/logs.log
appender.file.append=false
appender.file.layout.type=PatternLayout
appender.file.layout.pattern=[%level] %d{dd-MM-yyyy HH:mm:ss} [%t] [%X{test}] [%c] - %msg%n
# Define the stdout appender
appender.stdout.type=Console
appender.stdout.name=consoleAppender
appender.stdout.layout.type=PatternLayout
appender.stdout.layout.pattern=[%level] %d{dd-MM-yyyy HH:mm:ss} [%t] [%c] - %msg%n
# Configure root logger
rootLogger.level=INFO
rootLogger.appenderRef.file.ref=fileAppender
rootLogger.appenderRef.stdout.ref=consoleAppender
# Framework logger
logger.app.name=com.demoblaze
logger.app.level=INFO
